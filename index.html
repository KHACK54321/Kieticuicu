<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(160deg, #06263d, #031a2c 60%, #020f1c);
  color: #e6f7ff; min-height: 100vh; overflow: hidden;
}

#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: linear-gradient(180deg, rgba(2,15,28,.9), rgba(2,15,28,0));
  pointer-events: none; transition: opacity .25s ease;
}
#topbar.hidden { display: none; }
#topbar .tb-icon { width: 34px; height: 34px; border-radius: 9px; object-fit: contain;
  filter: drop-shadow(0 0 10px #38d6ff); pointer-events: auto; }
#topbar .tb-icon-fallback {
  width: 34px; height: 34px; border-radius: 9px;
  display: none; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #0a8fc4, #096a94);
  color: #fff; font-weight: 800; font-size: 15px;
  border: 2px solid #38d6ff; box-shadow: 0 0 12px rgba(56,214,255,.6);
  pointer-events: auto;
}
#topbar .tb-title {
  color: #38d6ff; font-weight: 800; font-size: 15px;
  letter-spacing: 1px; text-shadow: 0 0 12px rgba(56,214,255,.6); pointer-events: auto;
}
#topbar .tb-spacer { flex: 1; }
#topbar .tb-status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 10px; background: rgba(2,15,28,.7);
  border: 1px solid #0a5a7f; border-radius: 20px;
  pointer-events: auto; cursor: pointer;
  font-size: 12px; color: #a5d7ea; transition: .15s;
}
#topbar .tb-status:hover { border-color: #38d6ff; box-shadow: 0 0 10px rgba(56,214,255,.55); }
#topbar .tb-status .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }
.dot.green  { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
.dot.yellow { background: #facc15; box-shadow: 0 0 6px #facc15; }
.dot.red    { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

#legendPop {
  position: fixed; top: 58px; right: 16px; z-index: 30;
  background: linear-gradient(160deg, #06263d, #031a2c);
  border: 2px solid #0a8fc4; border-radius: 12px;
  box-shadow: 0 0 24px rgba(10,180,240,.55);
  padding: 12px 14px; min-width: 210px;
  display: none; font-size: 13px; animation: popIn .15s ease-out;
}
#legendPop.show { display: block; }
@keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
#legendPop h3 {
  color: #38d6ff; font-size: 13px; font-weight: 800;
  letter-spacing: .5px; margin-bottom: 10px;
  padding-bottom: 8px; border-bottom: 1px solid #0a5a7f; text-align: center;
}
#legendPop .lg-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 6px; }
#legendPop .lg-row + .lg-row { border-top: 1px dashed #0a3a52; }
#legendPop .lg-row .dot { width: 12px; height: 12px; flex-shrink: 0; }
#legendPop .lg-row .lg-key { font-weight: 800; color: #e6f7ff; min-width: 70px; }
#legendPop .lg-row .lg-desc { color: #a5d7ea; font-size: 12px; }

#landing {
  position: fixed; inset: 0; display: flex; align-items: center;
  justify-content: center; padding: 20px; z-index: 10; padding-top: 60px;
}
.card {
  background: linear-gradient(160deg, #0a3a5c, #041d30);
  border: 2px solid #0a8fc4; border-radius: 20px;
  padding: 40px 30px; max-width: 480px; width: 100%;
  text-align: center; box-shadow: 0 0 40px rgba(10,180,240,.4);
}
.logo { width: 80px; height: 80px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 0 20px #38d6ff); }
h1 { color: #38d6ff; font-size: 32px; letter-spacing: 1px; margin-bottom: 6px; text-shadow: 0 0 20px rgba(56,214,255,.6); }
.sub { color: #7fc7e0; font-size: 14px; margin-bottom: 30px; }
.upload-btn {
  display: block; padding: 18px 24px;
  background: linear-gradient(160deg, #0a8fc4, #096a94);
  border: 2px solid #38d6ff; border-radius: 12px; color: #fff;
  font-weight: 700; font-size: 16px; cursor: pointer;
  transition: .2s; box-shadow: 0 0 20px rgba(10,180,240,.5); letter-spacing: .5px;
}
.upload-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(56,214,255,.8); }
.upload-btn input[type=file] { display: none; }
.hint { margin-top: 16px; color: #7fc7e0; font-size: 13px; }
.note { margin-top: 24px; padding-top: 16px; border-top: 1px dashed #0a5a7f; color: #5fa8c4; font-size: 12px; line-height: 1.5; }
.note b { color: #4ade80; }

#viewer { display: none; position: fixed; inset: 0; width: 100%; height: 100%; border: none; background: #fff; z-index: 1; }
#landing.dragover .card { border-color: #4ade80; box-shadow: 0 0 50px rgba(74,222,128,.7); }
@media (max-width: 600px) {
  .card { padding: 30px 20px; }
  h1 { font-size: 26px; }
  .logo { width: 64px; height: 64px; }
  .upload-btn { padding: 16px 20px; font-size: 15px; }
  #topbar .tb-title { display: none; }
  #legendPop { right: 10px; left: 10px; min-width: 0; }
}
</style>
</head>
<body>

<div id="topbar">
  <img class="tb-icon" src="img/icon.png" alt=""
       onerror="this.style.display='none';document.getElementById('tbFallback').style.display='flex'">
  <div class="tb-icon-fallback" id="tbFallback">KI</div>
  <span class="tb-title">Kieticuicu</span>
  <span class="tb-spacer"></span>
  <span class="tb-status" id="tbStatus" title="Xem chú thích trạng thái">
    <span class="dot green"></span>
    <span class="dot yellow"></span>
    <span class="dot red"></span>
    <span style="margin-left:2px;font-weight:700">Status</span>
  </span>
</div>

<div id="legendPop">
  <h3>CHÚ THÍCH TRẠNG THÁI</h3>
  <div class="lg-row"><span class="dot green"></span>
    <span class="lg-key">Good</span><span class="lg-desc">Hoạt động bình thường</span></div>
  <div class="lg-row"><span class="dot yellow"></span>
    <span class="lg-key">NoTest</span><span class="lg-desc">Chưa kiểm tra</span></div>
  <div class="lg-row"><span class="dot red"></span>
    <span class="lg-key">Error</span><span class="lg-desc">Gặp lỗi</span></div>
</div>

<div id="landing">
  <div class="card">
    <img class="logo" src="img/icon.png" alt="" onerror="this.style.display='none'">
    <h1>Kieticuicu</h1>
    <p class="sub">Version 1.2.5</p>
    <label class="upload-btn">
      📁 CHỌN FILE HTML BÀI THI
      <input type="file" id="fileInput" accept=".html,.htm">
    </label>
    <p class="hint">スバルくんは、レムのヒーローなんです。</p>
    <p class="note">@KTG2105.</p>
  </div>
</div>

<iframe id="viewer"></iframe>

<!-- ============================================================
     TOOL CODE
     ============================================================ -->
<script type="text/plain" id="toolSrc">
(function () {
  'use strict';
  if (window.__kiV1Main) return;
  window.__kiV1Main = true;

  var ICON_URL = window.__kiIconUrl || '';
  window.__kiAntiCheatOn = false;

  var state = {
    logOn: false, logLines: [],
    panel: null, launch: null, hideTimer: null, isHidden: true,
    sendEndpoint: '',
    modal: null,
    violations: 0,
    revealed: false
  };

  /* ============================================================
     1. PATCH visibilitychange
     ============================================================ */
  (function patchVC() {
    if (document.__kiVCPatched) return;
    document.__kiVCPatched = true;
    var origAdd = document.addEventListener.bind(document);
    document.addEventListener = function (type, listener, options) {
      if (type === 'visibilitychange' && typeof listener === 'function' && !listener.__kiWrapped) {
        var orig = listener;
        var wrapped = function (e) {
          if (!window.__kiAntiCheatOn) return;
          return orig.call(this, e);
        };
        wrapped.__kiWrapped = true;
        wrapped.__kiOrig = orig;
        return origAdd(type, wrapped, options);
      }
      return origAdd(type, listener, options);
    };
  })();

  document.addEventListener('visibilitychange', function () {
    if (!window.__kiAntiCheatOn) return;
    if (document.hidden) {
      state.violations++;
      log('Vi phạm #' + state.violations + ' (rời trang)', 'WARN');
      updateViolationBox();
    }
  });

  /* ============================================================
     2. LOG
     ============================================================ */
  function log(msg, type) {
    type = type || 'INFO';
    var line = '[' + new Date().toLocaleTimeString() + '] [' + type + '] ' + msg;
    state.logLines.push(line);
    if (state.logLines.length > 200) state.logLines.shift();
    try { console.log('[Kieticuicu]', line); } catch (e) {}
    renderLog();
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }
  function decode(v) {
    if (v == null) return '';
    try { if (typeof window.decodeUTF8Base64 === 'function') return window.decodeUTF8Base64(v); } catch (e) {}
    try { return decodeURIComponent(escape(atob(v))); } catch (e) {}
    try { return atob(v); } catch (e) {}
    return String(v);
  }
  function cleanText(s) {
    return String(s == null ? '' : s)
      .replace(/<[^>]*>/g, ' ')
      .replace(/\$+/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function truncate(s, max) {
    s = String(s || '');
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }

  /* ============================================================
     3. AUTO-DETECT ENDPOINT
     ============================================================ */
  function detectEndpoint() {
    try {
      if (typeof window.WEBHOOK_URL === 'string' && /^https?:\/\//.test(window.WEBHOOK_URL)) return window.WEBHOOK_URL;
      if (typeof window.SEND_ENDPOINT === 'string' && /^https?:\/\//.test(window.SEND_ENDPOINT)) return window.SEND_ENDPOINT;
      if (typeof window.API_URL === 'string' && /^https?:\/\//.test(window.API_URL)) return window.API_URL;
    } catch (e) {}
    var pats = [
      /(?:const|let|var)\s+WEBHOOK_URL\s*=\s*["']([^"']+)["']/,
      /(?:const|let|var)\s+DEFAULT_ENDPOINT\s*=\s*["']([^"']+)["']/,
      /(?:const|let|var)\s+API_URL\s*=\s*["']([^"']+)["']/,
      /(?:const|let|var)\s+SEND_URL\s*=\s*["']([^"']+)["']/,
      /(?:const|let|var)\s+ENDPOINT\s*=\s*["']([^"']+)["']/
    ];
    var ss = document.scripts || [];
    for (var i = 0; i < ss.length; i++) {
      var txt = ss[i].textContent || '';
      for (var j = 0; j < pats.length; j++) {
        var m = txt.match(pats[j]);
        if (m && /^https?:\/\//.test(m[1])) return m[1];
      }
    }
    return '';
  }

  /* ============================================================
     4. ĐỌC ĐỀ
     ============================================================ */
  function findDataFromDOM() {
    var slides = [].slice.call(document.querySelectorAll('.slide-container'));
    if (!slides.length) return null;
    return slides.map(function (slide, i) {
      var contentEl = slide.querySelector('.question-content') || slide.querySelector('.question-text') || slide;
      var opts = [].slice.call(slide.querySelectorAll('.btn-option')).map(function (o) {
        var badge = o.querySelector('.opt-badge');
        var textEl = o.querySelector('.opt-text');
        return {
          label: badge ? badge.textContent.trim() : '',
          text: textEl ? textEl.textContent.trim() : '',
          is_correct: o.dataset.correct === 'true'
        };
      });
      return {
        index: i,
        content: cleanText(contentEl.textContent || ''),
        isTF: !!slide.querySelector('.tf-row'),
        opts: opts
      };
    });
  }
  function findDataFromScript() {
    try { if (Array.isArray(window.EXAM_DATA)) return window.EXAM_DATA; } catch (e) {}
    var scripts = [].slice.call(document.scripts);
    for (var k = 0; k < scripts.length; k++) {
      var text = scripts[k].textContent || '';
      var m = text.match(/\bEXAM_DATA\s*=\s*/);
      if (!m) continue;
      var start = m.index + m[0].length;
      var i = start, depth = 0, quote = null, escaped = false;
      for (; i < text.length; i++) {
        var ch = text[i];
        if (quote) {
          if (escaped) { escaped = false; continue; }
          if (ch === '\\') { escaped = true; continue; }
          if (ch === quote) quote = null;
          continue;
        }
        if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
        if (ch === '[') depth++;
        if (ch === ']') { depth--; if (depth === 0) break; }
      }
      if (depth !== 0) continue;
      try {
        var parsed = Function('"use strict";return (' + text.slice(start, i + 1) + ')')();
        if (Array.isArray(parsed)) return parsed;
      } catch (e) {}
    }
    return null;
  }

  /* ============================================================
     5. ĐÁP ÁN GỌN — có câu hỏi rút gọn + đáp án
        Output: "Câu 1: [nội dung 45 ký tự] → B"
     ============================================================ */
  function domFastLine(item, num) {
    if (!item) return null;
    var q = truncate(item.content, 45);
    if (item.isTF) {
      var parts = item.opts.map(function (o) { return o.label + '-' + (o.is_correct ? 'Đ' : 'S'); }).join(' ');
      return 'Câu ' + num + ': ' + (q ? q + ' → ' : '') + parts;
    }
    if (!item.opts || !item.opts.length) return null;
    var correct = item.opts.filter(function (o) { return o.is_correct; });
    if (!correct.length) return null;
    var labels = correct.map(function (o) { return o.label; }).join('+');
    return 'Câu ' + num + ': ' + (q ? q + ' → ' : '') + labels;
  }
  function scriptFastLine(q, num) {
    if (!q) return null;
    var text = truncate(cleanText(q.body || ''), 45);
    var ans = '';
    if (q.hash_key !== undefined) ans = decode(q.hash_key).trim();
    else if (q.hash_ans !== undefined) ans = decode(q.hash_ans).trim();
    else if (Array.isArray(q.options) && q.options.some(function (o) { return o && o.hash_truth !== undefined; })) {
      ans = q.options.map(function (o) { return (o.char || '') + '-' + decode(o.hash_truth).trim(); }).join(' ');
    }
    if (!ans) return null;
    return 'Câu ' + num + ': ' + (text ? text + ' → ' : '') + ans;
  }
  function scanFast() {
    var domData = findDataFromDOM();
    var lines = [];
    if (domData && domData.length && domData[0].opts && domData[0].opts.length) {
      domData.forEach(function (q, i) {
        var line = domFastLine(q, i + 1);
        if (line) lines.push(line);
      });
      return { lines: lines, source: 'DOM' };
    }
    var scriptData = findDataFromScript();
    if (!scriptData) return { error: 'Không tìm thấy dữ liệu đề' };
    scriptData.forEach(function (q, i) {
      var line = scriptFastLine(q, i + 1);
      if (line) lines.push(line);
    });
    return { lines: lines, source: 'EXAM_DATA' };
  }

  /* ============================================================
     6. ĐÁP ÁN CHI TIẾT — câu hỏi đầy đủ + nội dung đáp án
        Output: "Câu 1: [nội dung đầy đủ] → B. y = 2"
     ============================================================ */
  function domDetailLine(item, num) {
    if (!item) return null;
    var q = item.content;
    if (item.isTF) {
      var parts = item.opts.map(function (o) { return o.label + ': ' + (o.is_correct ? 'Đúng' : 'Sai'); }).join(' | ');
      return 'Câu ' + num + ': ' + (q ? q + '\n→ ' : '') + parts;
    }
    if (!item.opts || !item.opts.length) return null;
    var correct = item.opts.filter(function (o) { return o.is_correct; });
    if (!correct.length) return null;
    var labels = correct.map(function (o) { return o.label; }).join('+');
    var texts = correct.map(function (o) { return cleanText(o.text); }).filter(Boolean).join(' | ');
    return 'Câu ' + num + ': ' + (q ? q + '\n→ ' : '') + labels + (texts ? '. ' + texts : '');
  }
  function scriptDetailLine(q, num) {
    if (!q) return null;
    var text = cleanText(q.body || '');
    var ans = '', ansText = '';
    if (q.hash_key !== undefined) {
      ans = decode(q.hash_key).trim();
      var opt = (q.options || []).filter(function (o) { return o && o.char === ans; })[0];
      ansText = opt ? cleanText(opt.text) : '';
    } else if (q.hash_ans !== undefined) {
      ans = decode(q.hash_ans).trim();
    } else if (Array.isArray(q.options) && q.options.some(function (o) { return o && o.hash_truth !== undefined; })) {
      ans = q.options.map(function (o) { return (o.char || '') + ': ' + decode(o.hash_truth).trim(); }).join(' | ');
    }
    if (!ans) return null;
    return 'Câu ' + num + ': ' + (text ? text + '\n→ ' : '') + ans + (ansText ? '. ' + ansText : '');
  }
  function scanDetail() {
    var domData = findDataFromDOM();
    var lines = [];
    if (domData && domData.length && domData[0].opts && domData[0].opts.length) {
      domData.forEach(function (q, i) {
        var line = domDetailLine(q, i + 1);
        if (line) lines.push(line);
      });
      return { lines: lines, source: 'DOM' };
    }
    var scriptData = findDataFromScript();
    if (!scriptData) return { error: 'Không tìm thấy dữ liệu đề' };
    scriptData.forEach(function (q, i) {
      var line = scriptDetailLine(q, i + 1);
      if (line) lines.push(line);
    });
    return { lines: lines, source: 'EXAM_DATA' };
  }

  /* ============================================================
     7. AUTO-FILL ĐÁP ÁN ĐÚNG TRÊN ĐỀ
     ============================================================ */
  function autoFillCorrectAnswers() {
    var clicked = 0;
    var correctOpts = document.querySelectorAll('.btn-option[data-correct="true"]');
    correctOpts.forEach(function (el) {
      try {
        var cls = el.className || '';
        if (cls.indexOf('active') === -1 && cls.indexOf('selected') === -1 && cls.indexOf('chosen') === -1) {
          el.click();
          clicked++;
        }
      } catch (e) {}
    });
    return clicked;
  }

  /* ============================================================
     8. GỬI ĐIỂM
     ============================================================ */
  function doSendScore(payload) {
    return Promise.resolve().then(function () {
      if (typeof window.__kiOnSendScore === 'function') {
        return Promise.resolve(window.__kiOnSendScore(payload)).then(function (r) {
          if (r === undefined || r === null) return { ok: true };
          return r;
        }).catch(function (e) { return { ok: false, error: 'Hook lỗi: ' + e.message }; });
      }
      var endpoint = state.sendEndpoint || '';
      if (!endpoint) return { ok: false, error: 'Không tìm thấy endpoint trong file đề' };
      return fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function (res) {
        if (!res.ok) return { ok: false, error: 'HTTP ' + res.status };
        return { ok: true };
      }).catch(function (e) { return { ok: false, error: 'Fetch lỗi: ' + e.message }; });
    });
  }

  function ensureScoreModal() {
    if (state.modal) return state.modal;
    injectStyle();
    var ov = document.createElement('div');
    ov.id = '__ki_score_modal';
    ov.innerHTML =
      '<div class="ki-sbox">' +
        '<h2>📤 GỬI ĐIỂM</h2>' +
        '<div class="ki-sfields">' +
          '<div class="ki-sfield"><label>Họ tên *</label><input type="text" data-key="name" placeholder="Nguyễn Văn A"></div>' +
          '<div class="ki-sfield"><label>Lớp / ID *</label><input type="text" data-key="class_id" placeholder="12A1 / 001"></div>' +
          '<div class="ki-sfield"><label>Điểm *</label><input type="number" step="0.01" data-key="score" placeholder="0"></div>' +
          '<div class="ki-sfield"><label>Thời gian</label><input type="text" class="ki-stime" readonly></div>' +
        '</div>' +
        '<div class="ki-smsg"></div>' +
        '<div class="ki-warn" style="display:none;"></div>' +
        '<div class="ki-sactions">' +
          '<button class="ki-scancel">Hủy</button>' +
          '<button class="ki-ssend">GỬI</button>' +
        '</div>' +
      '</div>';
    var msg = ov.querySelector('.ki-smsg');
    var warnBox = ov.querySelector('.ki-warn');
    var sendBtn = ov.querySelector('.ki-ssend');
    var cancelBtn = ov.querySelector('.ki-scancel');
    var actionsEl = ov.querySelector('.ki-sactions');

    function collectValues() {
      var values = {}, firstErr = null;
      ov.querySelectorAll('[data-key]').forEach(function (el) {
        var k = el.dataset.key, v = (el.value || '').trim();
        if (!v && !firstErr) firstErr = el;
        values[k] = (k === 'score') ? (v === '' ? '' : Number(v)) : v;
      });
      return { values: values, firstErr: firstErr };
    }

    function doActualSend(payload) {
      msg.className = 'ki-smsg'; msg.textContent = 'Đang gửi...';
      sendBtn.disabled = true;
      doSendScore(payload).then(function (r) {
        sendBtn.disabled = false;
        if (r && r.ok) {
          setStatus('sendScore', 'green');
          msg.className = 'ki-smsg ok'; msg.textContent = '✅ Gửi thành công!';
          log('Gửi điểm OK: ' + JSON.stringify(payload), 'OK');
          setTimeout(function () { ov.classList.remove('show'); }, 900);
        } else {
          setStatus('sendScore', 'red');
          msg.className = 'ki-smsg err'; msg.textContent = '❌ ' + (r && r.error || 'Lỗi');
          log('Gửi điểm thất bại: ' + (r && r.error), 'ERR');
        }
      });
    }

    function buildPayload(values) {
      return {
        name: values.name,
        class_id: values.class_id,
        score: values.score,
        time: new Date().toLocaleString('vi-VN'),
        createdAt: new Date().toISOString(),
        violations: window.__kiAntiCheatOn ? state.violations : 0
      };
    }

    function showLowScoreWarning(values) {
      warnBox.style.display = 'block';
      warnBox.innerHTML =
        '<div class="ki-warn-title">⚠️ CẢNH BÁO ĐIỂM THẤP</div>' +
        '<div class="ki-warn-text">' +
          'Giám sát đang <b>BẬT</b>. Điểm bạn nhập là <b style="color:#fca5a5">' + values.score + '</b> (dưới 9.0).<br>' +
          'Bạn có muốn tự động sửa lại đề và điểm cho khớp không?' +
        '</div>' +
        '<div class="ki-warn-actions">' +
          '<button class="ki-warn-continue">📤 TIẾP TỤC NỘP</button>' +
          '<button class="ki-warn-fix">🔧 TỰ ĐỘNG SỬA</button>' +
        '</div>';
      cancelBtn.disabled = true;
      sendBtn.disabled = true;

      warnBox.querySelector('.ki-warn-continue').onclick = function () {
        warnBox.style.display = 'none';
        cancelBtn.disabled = false;
        sendBtn.disabled = false;
        log('Người dùng chọn TIẾP TỤC NỘP với điểm ' + values.score, 'WARN');
        doActualSend(buildPayload(values));
      };

      warnBox.querySelector('.ki-warn-fix').onclick = function () {
        warnBox.style.display = 'none';
        cancelBtn.disabled = false;
        sendBtn.disabled = false;
        var clicked = autoFillCorrectAnswers();
        var scoreInput = ov.querySelector('[data-key="score"]');
        scoreInput.value = 10;
        msg.className = 'ki-smsg ok';
        msg.textContent = '🔧 Đã tick ' + clicked + ' đáp án đúng và đặt điểm = 10. Bấm GỬI lại.';

    }

    sendBtn.onclick = function () {
      var c = collectValues();
      if (c.firstErr) {
        msg.className = 'ki-smsg err'; msg.textContent = '⚠️ Nhập đủ trường bắt buộc';
        c.firstErr.focus(); return;
      }
      var scoreNum = Number(c.values.score);
      if (isNaN(scoreNum)) {
        msg.className = 'ki-smsg err'; msg.textContent = '⚠️ Điểm không hợp lệ'; return;
      }
      // Cảnh báo điểm thấp khi giám sát BẬT
      if (window.__kiAntiCheatOn && scoreNum < 9) {
        showLowScoreWarning(c.values);
        return;
      }
      doActualSend(buildPayload(c.values));
    };

    cancelBtn.onclick = function () { ov.classList.remove('show'); };
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.classList.remove('show'); });

    (document.body || document.documentElement).appendChild(ov);
    state.modal = ov;
    return ov;
  }

  /* ============================================================
     10. STATUS
     ============================================================ */
  function setStatus(act, color) {
    if (!state.panel) return;
    var btn = state.panel.querySelector('[data-act="' + act + '"]');
    if (!btn) return;
    var dot = btn.querySelector('.dot');
    if (!dot) return;
    dot.classList.remove('green', 'yellow', 'red');
    dot.classList.add(color);
  }

  /* ============================================================
     11. UI
     ============================================================ */
  function showLaunch() { state.isHidden = false; if (state.launch) state.launch.classList.remove('ki-hidden'); }
  function hideLaunch() { state.isHidden = true; if (state.launch) state.launch.classList.add('ki-hidden'); }
  function revealLaunch() {
    if (!state.launch) return;
    state.launch.classList.add('ki-revealed');
    state.revealed = true;
  }
  function panelIsOpen() { return state.panel && state.panel.style.display === 'flex'; }
  function resetHideTimer() {
    revealLaunch();
    showLaunch();
    if (state.hideTimer) clearTimeout(state.hideTimer);
    state.hideTimer = setTimeout(function () { if (!panelIsOpen()) hideLaunch(); }, 3000);
  }

  function positionPanel() {
    var p = state.panel, l = state.launch;
    if (!p || !l) return;
    var lr = l.getBoundingClientRect();
    var pw = p.offsetWidth || 420, ph = p.offsetHeight || 400;
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = lr.right - pw, top = lr.bottom + 10;
    if (top + ph > vh - 8) top = Math.max(8, lr.top - ph - 10);
    left = Math.max(8, Math.min(vw - pw - 8, left));
    top = Math.max(8, Math.min(vh - ph - 8, top));
    p.style.setProperty('left', left + 'px', 'important');
    p.style.setProperty('top', top + 'px', 'important');
    p.style.setProperty('right', 'auto', 'important');
    p.style.setProperty('bottom', 'auto', 'important');
  }

  function ensureUI() {
    if (state.panel) return state.panel;
    injectStyle();

    /* Launch — ẩn ban đầu, click vào trang để hiện */
    var launch = document.getElementById('__ki_launch');
    if (!launch) {
      launch = document.createElement('button');
      launch.id = '__ki_launch';
      launch.title = 'Kieticuicu';
      if (ICON_URL) {
        var img = document.createElement('img');
        img.src = ICON_URL; img.alt = ''; img.draggable = false;
        img.onerror = function () { img.remove(); launch.textContent = 'KI'; launch.style.color = '#38d6ff'; launch.style.fontWeight = '700'; };
        launch.appendChild(img);
      } else {
        launch.textContent = 'KI'; launch.style.color = '#38d6ff'; launch.style.fontWeight = '700';
      }
      var dragging = false, moved = false, offX = 0, offY = 0, startX = 0, startY = 0;
      launch.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        dragging = true; moved = false;
        startX = e.clientX; startY = e.clientY;
        var r = launch.getBoundingClientRect();
        offX = e.clientX - r.left; offY = e.clientY - r.top;
        try { launch.setPointerCapture(e.pointerId); } catch (_) {}
        resetHideTimer();
      });
      launch.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if (!moved && Math.hypot(dx, dy) < 6) return;
        moved = true;
        var left = e.clientX - offX, top = e.clientY - offY;
        var w = launch.offsetWidth, h = launch.offsetHeight;
        left = Math.max(0, Math.min(window.innerWidth - w, left));
        top = Math.max(0, Math.min(window.innerHeight - h, top));
        launch.style.setProperty('left', left + 'px', 'important');
        launch.style.setProperty('top', top + 'px', 'important');
        launch.style.setProperty('right', 'auto', 'important');
        launch.style.setProperty('bottom', 'auto', 'important');
      });
      var endDrag = function (e) {
        if (!dragging) return;
        dragging = false;
        try { launch.releasePointerCapture(e.pointerId); } catch (_) {}
        setTimeout(function () { moved = false; }, 50);
      };
      launch.addEventListener('pointerup', endDrag);
      launch.addEventListener('pointercancel', endDrag);
      launch.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (moved) return;
        var p = ensureUI();
        if (state.isHidden) { resetHideTimer(); return; }
        var isOpen = p.style.display === 'flex';
        if (isOpen) p.style.display = 'none';
        else { p.style.display = 'flex'; positionPanel(); }
        resetHideTimer();
      });
      (document.body || document.documentElement).appendChild(launch);

      /* Click bất kỳ đâu trên trang → hiện launch */
      document.addEventListener('pointerdown', function () {
        if (state.revealed) return;
        revealLaunch();
        resetHideTimer();
      }, true);
      document.addEventListener('keydown', function () {
        if (state.revealed) return;
        revealLaunch();
        resetHideTimer();
      }, true);
    }
    state.launch = launch;

    /* Panel */
    var p = document.createElement('div');
    p.id = '__ki_panel';
    p.innerHTML =
      '<div class="ki-head">' +
        (ICON_URL ? '<img src="' + ICON_URL + '" alt="" onerror="this.remove()">' : '') +
        '<span class="ki-title">Kieticuicu</span>' +
        '<span class="ki-status">Sẵn sàng</span>' +
        '<button class="ki-trash" title="Dọn kết quả">🗑️</button>' +
      '</div>' +
      '<div class="ki-grid">' +
        '<button data-act="scanFast" class="fast">⚡ ĐÁP ÁN GỌN<span class="dot yellow"></span></button>' +
        '<button data-act="scanAll" class="detail">📊 ĐÁP ÁN CHI TIẾT<span class="dot yellow"></span></button>' +
        '<button data-act="antiCheat" class="guard on wide">🛡️ GIÁM SÁT: ON<span class="dot green"></span></button>' +
        '<button data-act="log">LOG: OFF<span class="dot yellow"></span></button>' +
        '<button data-act="sendScore" class="send">📤 GỬI ĐIỂM<span class="dot yellow"></span></button>' +
      '</div>' +
      '<div class="ki-viol"></div>' +
      '<div class="ki-result">Bấm <b style="color:#7fe3ff">⚡ ĐÁP ÁN GỌN</b> (chỉ đáp án) hoặc <b style="color:#7fe3ff">📊 CHI TIẾT</b> (kèm câu hỏi).</div>' +
      '<div class="ki-log"></div>';
    (document.body || document.documentElement).appendChild(p);

    p.querySelector('.ki-trash').onclick = function () { clearAll(); resetHideTimer(); };

    /* Nút ĐÁP ÁN GỌN */
    p.querySelector('[data-act="scanFast"]').onclick = function () {
      var r = scanFast();
      if (r.error) { renderResult({ error: r.error }); setStatus('scanFast', 'red'); return; }
      renderCompact(r.lines, false);
      setStatus('scanFast', 'green');
      log('Đáp án gọn: ' + r.lines.length + ' câu (' + r.source + ')', 'OK');
      resetHideTimer();
    };

    /* Nút ĐÁP ÁN CHI TIẾT */
    p.querySelector('[data-act="scanAll"]').onclick = function () {
      var r = scanDetail();
      if (r.error) { renderResult({ error: r.error }); setStatus('scanAll', 'red'); return; }
      renderCompact(r.lines, true);
      setStatus('scanAll', 'green');
      log('Đáp án chi tiết: ' + r.lines.length + ' câu (' + r.source + ')', 'OK');
      resetHideTimer();
    };

    /* Toggle giám sát */
    p.querySelector('[data-act="antiCheat"]').onclick = function () {
      window.__kiAntiCheatOn = !window.__kiAntiCheatOn;
      updateAntiCheatBtn(); updateViolationBox();
      log('🛡️ Giám sát: ' + (window.__kiAntiCheatOn ? 'BẬT' : 'TẮT'), 'INFO');
      resetHideTimer();
    };

    /* Toggle log */
    p.querySelector('[data-act="log"]').onclick = function () {
      state.logOn = !state.logOn;
      renderLog(); updateLogBtn();
      setStatus('log', state.logOn ? 'green' : 'yellow');
      resetHideTimer();
    };

    /* Gửi điểm */
    p.querySelector('[data-act="sendScore"]').onclick = function () {
      try { openScoreModal(); } catch (e) { log('Modal lỗi: ' + e.message, 'ERR'); }
      resetHideTimer();
    };

    state.panel = p;
    renderLog();
    resetHideTimer();
    return p;
  }

  function updateLogBtn() {
    if (!state.panel) return;
    var b = state.panel.querySelector('[data-act="log"]');
    if (!b) return;
    var dot = b.querySelector('.dot');
    b.textContent = 'LOG: ' + (state.logOn ? 'ON' : 'OFF');
    if (dot) b.appendChild(dot);
    b.classList.toggle('on', state.logOn);
  }

  function updateAntiCheatBtn() {
    if (!state.panel) return;
    var b = state.panel.querySelector('[data-act="antiCheat"]');
    if (!b) return;
    var dot = b.querySelector('.dot');
    b.textContent = '🛡️ GIÁM SÁT: ' + (window.__kiAntiCheatOn ? 'ON' : 'OFF');
    if (dot) b.appendChild(dot);
    b.classList.toggle('on', window.__kiAntiCheatOn);
    b.classList.toggle('off', !window.__kiAntiCheatOn);
    setStatus('antiCheat', window.__kiAntiCheatOn ? 'green' : 'red');
  }

  function updateViolationBox() {
    if (!state.panel) return;
    var box = state.panel.querySelector('.ki-viol');
    if (!box) return;
    if (!window.__kiAntiCheatOn) {
      box.style.display = 'block';
      box.style.background = 'rgba(74,222,128,.10)';
      box.style.border = '1px solid #166534';
      box.style.color = '#86efac';
      box.textContent = '🛡️ Giám sát TẮT — đề sẽ không báo vi phạm, không tự thu bài.';
    } else if (state.violations > 0) {
      box.style.display = 'block';
      box.style.background = 'rgba(239,68,68,.12)';
      box.style.border = '1px solid #7f1d1d';
      box.style.color = '#fda4af';
      box.textContent = '⚠️ Vi phạm: ' + state.violations + ' lần (rời trang)';
    } else {
      box.style.display = 'none';
    }
  }

  function renderCompact(lines, isDetail) {
    var p = state.panel || ensureUI();
    var out = p.querySelector('.ki-result');
    var status = p.querySelector('.ki-status');
    out.innerHTML = '<div class="ki-compact">' + lines.map(function (l) {
      /* Mỗi line có thể có \n — biến thành <br> */
      var html = esc(l).replace(/\n/g, '<br>');
      return '<div class="ki-compact-line' + (isDetail ? ' detail' : '') + '">' + html + '</div>';
    }).join('') + '</div>';
    status.textContent = (isDetail ? 'Chi tiết ' : 'Gọn ') + lines.length + ' câu';
  }

  function renderResult(data) {
    var p = state.panel || ensureUI();
    var out = p.querySelector('.ki-result'), status = p.querySelector('.ki-status');
    if (!data || data.error) {
      out.innerHTML = '<div class="ki-err">❌ ' + esc(data && data.error || 'Lỗi') + '</div>';
      status.textContent = 'Lỗi'; return;
    }
    out.innerHTML = '';
    status.textContent = 'Xong';
  }

  function renderLog() {
    if (!state.panel) return;
    var el = state.panel.querySelector('.ki-log');
    if (!el) return;
    el.innerHTML = state.logLines.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
    el.scrollTop = el.scrollHeight;
    el.style.display = state.logOn ? 'block' : 'none';
  }

  function clearAll() {
    state.logLines = [];
    if (state.panel) {
      state.panel.querySelector('.ki-result').innerHTML =
        'Bấm <b style="color:#7fe3ff">⚡ ĐÁP ÁN GỌN</b> (chỉ đáp án) hoặc <b style="color:#7fe3ff">📊 CHI TIẾT</b> (kèm câu hỏi).';
      state.panel.querySelector('.ki-status').textContent = 'Sẵn sàng';
    }
  }

  /* ============================================================
     12. BOOT
     ============================================================ */
  function boot() {
    try {
      state.sendEndpoint = detectEndpoint();
      ensureUI();
      log('Kieticuicu v1.2.5 sẵn sàng', 'OK');
      if (state.sendEndpoint) log('Endpoint phát hiện: ' + state.sendEndpoint.slice(0, 65) + '…', 'OK');
      else log('⚠️ Không tìm thấy endpoint trong file đề', 'ERR');
      log('🛡️ Giám sát: ' + (window.__kiAntiCheatOn ? 'BẬT' : 'TẮT'), 'INFO');
    } catch (e) {
      try { console.error('[Kieticuicu] boot error:', e); } catch (_) {}
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else setTimeout(boot, 0);

  window.KiApi = {
    setScoreEndpoint: function (u) { state.sendEndpoint = u; },
    getEndpoint: function () { return state.sendEndpoint; },
    setAntiCheat: function (on) { window.__kiAntiCheatOn = !!on; updateAntiCheatBtn(); updateViolationBox(); },
    scanFast: scanFast,
    scanDetail: scanDetail,
    autoFillCorrectAnswers: autoFillCorrectAnswers,
    getViolations: function () { return { count: state.violations }; },
    getLogs: function () { return state.logLines.slice(); },
    log: log
  };
})();
</script>

<!-- ============================================================
     APP CODE
     ============================================================ -->
<script>
(function () {
  'use strict';

  var fileInput = document.getElementById('fileInput');
  var viewer    = document.getElementById('viewer');
  var landing   = document.getElementById('landing');
  var topbar    = document.getElementById('topbar');
  var legendPop = document.getElementById('legendPop');

  var ICON_URL = new URL('img/icon.png', location.href).href;
  var TOOL_CODE = document.getElementById('toolSrc').textContent;

  var tbStatus = document.getElementById('tbStatus');
  if (tbStatus && legendPop) {
    tbStatus.addEventListener('click', function (e) {
      e.stopPropagation();
      legendPop.classList.toggle('show');
    });
    document.addEventListener('click', function (e) {
      if (!legendPop.contains(e.target) && e.target !== tbStatus) {
        legendPop.classList.remove('show');
      }
    });
  }

  fileInput.addEventListener('change', async function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) await loadFile(file);
  });

  landing.addEventListener('dragover', function (e) { e.preventDefault(); landing.classList.add('dragover'); });
  landing.addEventListener('dragleave', function () { landing.classList.remove('dragover'); });
  landing.addEventListener('drop', async function (e) {
    e.preventDefault();
    landing.classList.remove('dragover');
    var file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) await loadFile(file);
  });

  async function loadFile(file) {
    if (!/\.html?$/i.test(file.name)) {
      alert('⚠️ Vui lòng chọn file .html hoặc .htm');
      return;
    }
    var html;
    try { html = await file.text(); }
    catch (err) { alert('❌ Không đọc được file: ' + err.message); return; }

    var inject =
      '<scr' + 'ipt>window.__kiIconUrl = ' + JSON.stringify(ICON_URL) + ';</scr' + 'ipt>' +
      '<scr' + 'ipt>' + TOOL_CODE + '</scr' + 'ipt>';

    if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, inject + '</body>');
    else if (/<\/html>/i.test(html)) html = html.replace(/<\/html>/i, inject + '</html>');
    else html += inject;

    landing.style.display = 'none';
    topbar.classList.add('hidden');
    legendPop.classList.remove('show');
    viewer.style.display = 'block';
    viewer.srcdoc = html;

    console.log('[Kieticuicu] Đã nhúng tool vào HTML');
  }
})();
</script>
